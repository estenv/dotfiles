# Hardened forward proxy for autonomous coding-agent containers.
#
# Goal:
#   - Fail closed.
#   - Permit dependency installation from npm, PyPI, and NuGet/.NET.
#   - Permit GitHub Copilot provider endpoints only.
#   - Do not permit github.com, api.github.com, or general GitHub content hosts.
#   - Reduce credential/code exfiltration risk as much as a forward proxy can.

########################################
# Listener / identity
########################################

http_port 3128
visible_hostname agent-egress-proxy
pid_filename /var/spool/squid/squid.pid

########################################
# Local proxy exposure
########################################

# Keep this as narrow as your Docker network allows. For a single dedicated
# bridge network, replace 172.16.0.0/12 with the exact subnet, for example:
#   acl agent_containers src 172.23.0.0/16
acl agent_containers src 172.16.0.0/12
acl agent_containers src 10.0.0.0/8
acl agent_containers src 192.168.0.0/16

acl to_localhost dst 0.0.0.0/32
acl to_localhost dst 127.0.0.0/8
acl to_localhost dst ::1
acl to_linklocal dst 169.254.0.0/16
acl to_private dst 10.0.0.0/8
acl to_private dst 172.16.0.0/12
acl to_private dst 192.168.0.0/16
acl to_private dst fc00::/7
acl to_private dst fe80::/10

########################################
# Methods and ports
########################################

acl CONNECT method CONNECT

# Strong default: only HTTPS CONNECT. Almost all modern language registries use
# HTTPS. If you need apt/yum HTTP mirrors, add a separate, very narrow HTTP
# allow rule for those hosts only.
acl SSL_ports port 443
acl Safe_ports port 443

########################################
# Allowed HTTPS destination domains.
########################################

# GitHub Copilot provider endpoints only.
#
# Deliberately NOT allowed:
#   - github.com
#   - api.github.com
#   - codeload.github.com
#   - raw.githubusercontent.com
#   - objects.githubusercontent.com
#   - broad .githubusercontent.com
#
# This prevents a compromised agent from pushing code to attacker-controlled
# GitHub repositories with self-supplied credentials. Copilot may need broader
# auth/user-management endpoints in some editor setups; add them only in a
# separate, temporary trust mode, not in the default autonomous container.
acl allow_copilot dstdomain \
  .githubcopilot.com \
  .individual.githubcopilot.com \
  .business.githubcopilot.com \
  .enterprise.githubcopilot.com \
  copilot-proxy.githubusercontent.com \
  origin-tracker.githubusercontent.com \
  copilot-telemetry.githubusercontent.com \
  default.exp-tas.com

# JavaScript / TypeScript.
acl allow_node dstdomain \
  registry.npmjs.org \
  registry.npmjs.com \
  registry.yarnpkg.com \
  repo.yarnpkg.com \
  get.pnpm.io \
  nodejs.org

# Python.
acl allow_python dstdomain \
  pypi.org \
  pypi.python.org \
  files.pythonhosted.org \
  .pythonhosted.org \
  bootstrap.pypa.io \
  pip.pypa.io

# NuGet / .NET.
acl allow_dotnet dstdomain \
  api.nuget.org \
  globalcdn.nuget.org \
  azuresearch-usnc.nuget.org \
  azuresearch-ussc.nuget.org \
  dist.nuget.org \
  dot.net \
  dotnet.microsoft.com \
  builds.dotnet.microsoft.com \
  dotnetcli.blob.core.windows.net \
  nugetregistryv2prod.blob.core.windows.net

########################################
# HTTP access policy
########################################

# Do not run as an open proxy.
http_access deny !agent_containers

# Do not let the proxy reach internal networks, metadata endpoints, or itself.
# This matters if an agent tries to use the proxy as an SSRF primitive.
http_access deny to_localhost
http_access deny to_linklocal
http_access deny to_private

# Port and method restrictions.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT

# Main allowlist. CONNECT tunnels only to approved HTTPS hosts.
http_access allow CONNECT allow_copilot
http_access allow CONNECT allow_node
http_access allow CONNECT allow_python
http_access allow CONNECT allow_dotnet

# Fail closed.
http_access deny all

########################################
# Privacy / leakage reduction for plain HTTP and bumped HTTPS
########################################

# The baseline policy denies plain HTTP, so these mainly protect you if you add
# narrow HTTP exceptions later or enable ssl_bump. They do not affect opaque
# CONNECT tunnels.
forwarded_for delete
via off
request_header_access Authorization deny all
request_header_access Proxy-Authorization deny all
request_header_access Cookie deny all
request_header_access Set-Cookie deny all
request_header_access All allow all

# Prevent large cleartext uploads in any non-tunneled traffic. Does not limit
# opaque CONNECT tunnel payloads.
request_body_max_size 1 MB all

########################################
# Caching and logging
########################################

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

# Default access_log is fine; this format makes CONNECT decisions easier to
# audit while avoiding request bodies.
logformat agent_egress %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %Sh/%<A %mt
access_log /var/log/squid/access.log agent_egress

########################################
# Operational notes
########################################
#
# Keep repository cloning, checkout, and pushing outside the autonomous
# container. Mount the prepared working tree into the container instead.
#
# If an agent needs a temporary broader network for maintenance, use a separate
# trust mode with a different Squid config rather than weakening this default.
#
# Combine this proxy with:
#   - no GitHub tokens inside the container;
#   - read-only bind mounts for git config/credentials;
#   - GIT_TERMINAL_PROMPT=0 and disabled credential helpers;
#   - Docker/host firewall rules that prevent all non-proxy egress;
#   - package-manager configs pinned to approved registries.
